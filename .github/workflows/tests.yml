name: Tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        laravel: ['12', '13']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: ramsey/composer-install@v3
      - name: Install Laravel compatibility version
        run: composer require --no-interaction --no-update "illuminate/support:^${{ matrix.laravel }}.0"
      - run: composer update --prefer-dist --no-interaction
      - run: composer test
